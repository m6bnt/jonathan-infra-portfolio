<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <title>Mehdi MAZOUZ | Ingénieur Système & Réseau Junior</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap');

    :root {
      --void-black: #000000;
      --panel-bg: rgba(10, 10, 12, 0.3);
      --glass-border: rgba(255, 255, 255, 0.05);
      --text-pure: #ffffff;
      --text-muted: #8a8f98;
      --ai-cyan: #00f0ff;
      --ai-purple: #8b5cf6;
      --ai-magenta: #ff0055;
      --plasma-gradient: linear-gradient(135deg, var(--ai-cyan), var(--ai-purple), var(--ai-magenta));
    }

    * {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--void-black);
      color: var(--text-pure);
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    /* --- NEURAL NETWORK CANVAS BACKGROUND --- */
    #neural-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: -2;
      pointer-events: none;
    }

    .ambient-glow {
      position: fixed; top: -20vh; left: 10vw; width: 80vw; height: 80vh;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.08) 0%, transparent 60%);
      filter: blur(100px); z-index: -3; pointer-events: none;
    }

    /* --- DYNAMIC PILL NAVBAR --- */
    nav {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(5, 5, 5, 0.5);
      backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 100px; z-index: 1000;
      padding: 10px 16px 10px 24px;
      display: flex; align-items: center; gap: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .nav-logo {
      font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 1.1rem;
      color: var(--text-pure); text-decoration: none; letter-spacing: -0.5px;
      display: flex; align-items: center; gap: 8px;
    }
    .nav-logo::before {
      content: ''; width: 8px; height: 8px; background: var(--ai-cyan); border-radius: 50%;
      box-shadow: 0 0 12px var(--ai-cyan); animation: pulse 2s infinite;
    }
    nav ul { list-style: none; display: flex; gap: 30px; align-items: center; }
    nav ul li a {
      color: var(--text-muted); font-size: 0.85rem; font-weight: 500; text-decoration: none;
      text-transform: uppercase; letter-spacing: 1px; transition: color 0.3s;
    }
    nav ul li a:hover { color: var(--ai-cyan); text-shadow: 0 0 10px rgba(0,240,255,0.5); }
    
    .btn-nav {
      background: var(--text-pure); color: var(--void-black);
      padding: 8px 20px; border-radius: 100px; font-weight: 700; font-size: 0.85rem;
      text-transform: uppercase; letter-spacing: 1px; text-decoration: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-nav:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(255,255,255,0.3); }

    /* --- LAYOUT GLOBAL --- */
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    .section { padding: 160px 0 60px; }
    
    .section-header { margin-bottom: 70px; }
    .section-tag {
      font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; font-weight: 700;
      color: var(--ai-purple); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; display: block;
    }
    .section-title {
      font-size: 3.5rem; font-weight: 900; letter-spacing: -2px; color: var(--text-pure); line-height: 1;
    }
    .text-plasma {
      background: var(--plasma-gradient); background-size: 200% auto;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: gradientFlow 5s ease infinite;
    }
    @keyframes gradientFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    /* --- HERO SECTION --- */
    .hero { min-height: 100vh; display: flex; align-items: center; gap: 60px; padding-top: 120px; }
    .hero-content { flex: 1; z-index: 10; }
    
    .system-badge {
      display: inline-flex; align-items: center; gap: 10px;
      background: rgba(0, 240, 255, 0.05); border: 1px solid rgba(0, 240, 255, 0.2);
      padding: 6px 16px; border-radius: 100px; font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem; color: var(--ai-cyan); margin-bottom: 30px; letter-spacing: 1px;
    }
    
    .hero-content h1 {
      font-size: 6rem; font-weight: 900; line-height: 0.95; letter-spacing: -3px; margin-bottom: 20px;
    }
    .hero-content h2 { font-size: 1.8rem; font-weight: 400; color: var(--text-muted); margin-bottom: 30px; letter-spacing: -0.5px; }
    .hero-content p { font-size: 1.15rem; color: var(--text-muted); line-height: 1.8; max-width: 650px; margin-bottom: 50px; font-weight: 300; }

    .action-group { display: flex; gap: 20px; flex-wrap: wrap; }
    
    .magnetic-wrap { display: inline-block; padding: 10px; margin: -10px; }
    .btn-magnetic {
      background: var(--text-pure); color: var(--void-black);
      padding: 16px 36px; border-radius: 100px; font-weight: 700; font-size: 1.05rem;
      text-decoration: none; display: inline-flex; align-items: center; gap: 10px;
      transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.3s;
    }
    .magnetic-wrap:hover .btn-magnetic { box-shadow: 0 10px 30px rgba(255,255,255,0.25); }
    
    .btn-glass {
      background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); color: var(--text-pure);
      padding: 16px 36px; border-radius: 100px; font-weight: 500; font-size: 1.05rem;
      text-decoration: none; display: inline-flex; align-items: center; gap: 10px;
      backdrop-filter: blur(10px); transition: all 0.3s;
    }
    .btn-glass:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }

    .linkedin-premium {
      color: #e8a846 !important;
      filter: drop-shadow(0 0 8px rgba(232, 168, 70, 0.6));
      transition: all 0.3s ease;
    }

    .hero-visual { position: relative; flex-shrink: 0; z-index: 10; }
    .hero-visual img {
      width: 420px; height: 500px; object-fit: cover; border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      filter: grayscale(20%) contrast(1.1); transition: all 0.5s ease;
    }
    .hero-visual::before {
      content: ''; position: absolute; inset: -10px;
      background: var(--plasma-gradient); background-size: 200% auto;
      border-radius: 34px; filter: blur(30px); opacity: 0.3; z-index: -1;
      animation: gradientFlow 5s linear infinite;
    }
    .hero-visual:hover img { filter: grayscale(0%) contrast(1); transform: translateY(-10px) scale(1.02); }
    .hero-visual:hover::before { opacity: 0.6; }

    /* --- SPOTLIGHT BENTO CARDS --- */
    .bento-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 24px; }
    .bento-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
    
    .spotlight-card {
      background: rgba(255, 255, 255, 0.01);
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      display: flex; flex-direction: column;
    }
    .spotlight-card::before {
      content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(600px circle at var(--mouse-x) var(--mouse-y), rgba(255,255,255,0.06), transparent 40%);
      border-radius: inherit; z-index: 3; opacity: 0; transition: opacity 0.5s; pointer-events: none;
    }
    .spotlight-card::after {
      content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
      background: radial-gradient(400px circle at var(--mouse-x) var(--mouse-y), rgba(0,240,255,0.5), transparent 40%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      z-index: 1; opacity: 0; transition: opacity 0.5s; pointer-events: none;
    }
    .spotlight-card:hover::before, .spotlight-card:hover::after { opacity: 1; }

    .card-content {
      background: var(--panel-bg); border-radius: inherit; margin: 1px; padding: 40px;
      z-index: 2; position: relative; height: calc(100% - 2px); display: flex; flex-direction: column;
      backdrop-filter: blur(20px); transition: transform 0.3s ease;
    }
    .spotlight-card:hover .card-content { transform: scale(0.99); background: rgba(15, 15, 20, 0.5); }

    .card-icon {
      font-size: 2.2rem; margin-bottom: 24px;
      background: var(--plasma-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      display: inline-block;
    }
    .card-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 16px; color: var(--text-pure); letter-spacing: -0.5px; }
    .card-desc { color: var(--text-muted); font-size: 1.05rem; line-height: 1.7; flex-grow: 1; }

    .data-list { list-style: none; margin-top: 24px; }
    .data-list li {
      display: flex; align-items: flex-start; gap: 12px; padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 0.95rem; color: #d4d4d8;
    }
    .data-list li:last-child { border-bottom: none; padding-bottom: 0; }
    .data-list i { color: var(--ai-cyan); font-size: 0.85rem; margin-top: 4px; }

    /* --- NEURAL TIMELINE --- */
    .timeline { position: relative; padding-left: 40px; }
    .timeline::before {
      content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 1px;
      background: linear-gradient(to bottom, var(--ai-cyan), var(--ai-purple), transparent); opacity: 0.5;
    }
    .timeline-item { position: relative; margin-bottom: 60px; }
    .timeline-dot {
      position: absolute; width: 15px; height: 15px;
      background: var(--void-black); border: 2px solid var(--ai-cyan); border-radius: 50%;
      left: -47px; top: 6px; box-shadow: 0 0 15px var(--ai-cyan);
    }
    .timeline-content {
      background: var(--panel-bg); border: 1px solid var(--glass-border);
      padding: 30px 40px; border-radius: 24px; backdrop-filter: blur(20px);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .timeline-content:hover { border-color: rgba(0,240,255,0.2); transform: translateX(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .timeline-date {
      display: inline-block; padding: 6px 14px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
      border-radius: 100px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; font-weight: 700;
      margin-bottom: 16px; letter-spacing: 1px;
    }
    .timeline-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; color: #fff; }
    .timeline-org { color: var(--ai-cyan); font-size: 1.05rem; margin-bottom: 20px; font-weight: 500; }

    .badge {
      font-family: 'JetBrains Mono', monospace; padding: 6px 14px; border-radius: 100px; font-size: 0.75rem; font-weight: 700;
      display: inline-block; margin-bottom: 20px; letter-spacing: 1px; text-transform: uppercase;
    }
    .badge-data { background: rgba(0, 240, 255, 0.1); color: var(--ai-cyan); border: 1px solid rgba(0, 240, 255, 0.2); }
    .badge-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--glass-border); }

    .action-link {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 24px;
      color: var(--text-pure); font-size: 0.95rem; font-weight: 600; text-decoration: none;
      transition: gap 0.3s, color 0.3s;
    }
    .action-link:hover { color: var(--ai-cyan); gap: 12px; }

    /* --- TERMINAL FOOTER / CONTACT --- */
    .contact-panel {
      background: radial-gradient(circle at top, rgba(20,20,25,0.8
