<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <title>404 - Système hors ligne | Mehdi MAZOUZ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap');

    :root {
      --void-black: #000000;
      --text-pure: #ffffff;
      --text-muted: #8a8f98;
      --ai-cyan: #00f0ff;
      --ai-magenta: #ff0055;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--void-black);
      color: var(--text-pure);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      text-align: center;
    }

    /* --- CANVAS BACKGROUND --- */
    #neural-canvas {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: -2; pointer-events: none;
    }

    .error-code {
      font-size: 10rem;
      font-weight: 900;
      font-family: 'JetBrains Mono', monospace;
      background: linear-gradient(135deg, var(--ai-magenta), var(--ai-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 20px;
      text-shadow: 0 0 40px rgba(255, 0, 85, 0.4);
    }

    .error-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .error-desc {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 40px;
      max-width: 500px;
    }

    .btn-home {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0, 240, 255, 0.5);
      color: var(--ai-cyan);
      padding: 16px 36px;
      border-radius: 100px;
      font-weight: 600;
      font-size: 1.05rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s;
      backdrop-filter: blur(10px);
    }

    .btn-home:hover {
      background: rgba(0, 240, 255, 0.1);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
      transform: translateY(-3px);
    }
  </style>
</head>
<body>

<canvas id="neural-canvas"></canvas>

<div class="error-code">404</div>
<div class="error-title">ERREUR CRITIQUE : PAGE INTROUVABLE</div>
<div class="error-desc">
  Le lien que vous avez suivi est corrompu ou la page a été déplacée. Le système n'a pas pu localiser la ressource demandée.
</div>

<a href="https://mazouz-mehdi.github.io/" class="btn-home">
  <i class="fa-solid fa-rotate-left"></i> Redémarrer le système (Accueil)
</a>

<script>
  // Animation des particules (Couleur magenta pour l'erreur)
  const canvas = document.getElementById('neural-canvas');
  const ctx = canvas.getContext('2d');
  let particlesArray = [];
  
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  let mouse = { x: null, y: null, radius: 150 };

  window.addEventListener('mousemove', function(event) {
    mouse.x = event.x; mouse.y = event.y;
  });

  class Particle {
    constructor(x, y, directionX, directionY, size, color) {
      this.x = x; this.y = y;
      this.directionX = directionX; this.directionY = directionY;
      this.size = size; this.color = color;
      this.density = (Math.random() * 30) + 1;
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
      ctx.fillStyle = this.color; ctx.fill();
    }
    update() {
      if (this.x > canvas.width || this.x < 0) this.directionX = -this.directionX;
      if (this.y > canvas.height || this.y < 0) this.directionY = -this.directionY;
      
      let dx = mouse.x - this.x; let dy = mouse.y - this.y;
      let distance = Math.sqrt(dx*dx + dy*dy);
      
      if (distance < mouse.radius + this.size) {
        let forceDirectionX = dx / distance;
        let forceDirectionY = dy / distance;
        let force = (mouse.radius - distance) / mouse.radius;
        this.x -= forceDirectionX * force * this.density;
        this.y -= forceDirectionY * force * this.density;
      }
      this.x += this.directionX; this.y += this.directionY;
      this.draw();
    }
  }

  function init() {
    particlesArray = [];
    let numberOfParticles = (canvas.height * canvas.width) / 12000;
    for (let i = 0; i < numberOfParticles; i++) {
      let size = (Math.random() * 2) + 1;
      let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
      let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
      let color = '#ff0055'; // Rouge/Magenta pour l'alerte
      particlesArray.push(new Particle(x, y, (Math.random() * 1.6) - 0.8, (Math.random() * 1.6) - 0.8, size, color));
    }
  }

  function animate() {
    requestAnimationFrame(animate);
    ctx.clearRect(0,0,innerWidth, innerHeight);
    for (let i = 0; i < particlesArray.length; i++) { particlesArray[i].update(); }
    connect();
  }

  function connect() {
    for (let a = 0; a < particlesArray.length; a++) {
      for (let b = a; b < particlesArray.length; b++) {
        let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x)) + 
                       ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
        if (distance < (canvas.width/7) * (canvas.height/7)) {
          let opacityValue = 1 - (distance/20000);
          ctx.strokeStyle = 'rgba(255, 0, 85,' + opacityValue + ')';
          ctx.lineWidth = 1; ctx.beginPath();
          ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
          ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
          ctx.stroke();
        }
      }
    }
  }

  window.addEventListener('resize', () => { canvas.width = innerWidth; canvas.height = innerHeight; init(); });
  init(); animate();
</script>

</body>
</html>
